<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura Frontal Tarjeta</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #fff; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-monto { background-color: #0f172a; border: 1px solid #334155; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <!-- HEADER MINIMALISTA -->
    <div class="w-full max-w-sm mb-4 pl-1">
        <div class="flex items-center gap-1.5 mb-1 opacity-70">
            <img src="./assets/Logo Quadra Alt Titanium 2.svg" alt="Quadra Logo" class="h-6 w-6">
            <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-300">Powered by Quadra</span>
        </div>
        <h1 class="text-3xl font-black text-white tracking-tight">Editor de Pizarras</h1>
    </div>

    <!-- CONTENEDOR PRINCIPAL DEL EDITOR (Simulación Móvil) -->
    <div class="glass-panel w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col relative pb-8">
        
        <h2 class="text-2xl font-black text-white tracking-tight mb-4">Caja de Precios</h2>
        
        <!-- Botón Superior -->
        <button type="button" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl text-sm flex justify-center items-center gap-2 shadow-lg shadow-blue-500/20 mb-5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
            Actualizar Precios
        </button>

        <!-- Cabecera de Tabla Móvil -->
        <div class="flex justify-between text-[10px] text-slate-400 font-bold uppercase px-2 mb-3 tracking-wider">
            <span class="w-[20%] text-center">Divisa</span>
            <span class="w-[40%] text-center">Compra</span>
            <span class="w-[40%] text-center">Venta</span>
        </div>

        <!-- Lista de Inputs (Hardcodeada para la captura visual perfecta) -->
        <div class="space-y-3">
            
            <div class="flex items-center gap-2">
                <div class="w-[20%] flex flex-col items-center justify-center gap-1">
                    <div class="w-8 h-8 rounded-full border border-slate-700 bg-slate-900 flex items-center justify-center overflow-hidden">
                        <img src="./icons/circle-flags/us.svg" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[10px] font-bold text-white tracking-wide">USD</span>
                </div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">977</div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">997</div>
            </div>

            <div class="flex items-center gap-2">
                <div class="w-[20%] flex flex-col items-center justify-center gap-1">
                    <div class="w-8 h-8 rounded-full border border-slate-700 bg-slate-900 flex items-center justify-center overflow-hidden">
                        <img src="./icons/circle-flags/eu.svg" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[10px] font-bold text-white tracking-wide">EUR</span>
                </div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">1.097</div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">1.120</div>
            </div>

            <div class="flex items-center gap-2">
                <div class="w-[20%] flex flex-col items-center justify-center gap-1">
                    <div class="w-8 h-8 rounded-full border border-slate-700 bg-slate-900 flex items-center justify-center overflow-hidden">
                        <img src="./icons/circle-flags/ar.svg" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[10px] font-bold text-white tracking-wide">ARS</span>
                </div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">0,61</div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">0,65</div>
            </div>

            <div class="flex items-center gap-2">
                <div class="w-[20%] flex flex-col items-center justify-center gap-1">
                    <div class="w-8 h-8 rounded-full border border-slate-700 bg-slate-900 flex items-center justify-center overflow-hidden">
                        <img src="./icons/circle-flags/br.svg" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[10px] font-bold text-white tracking-wide">BRL</span>
                </div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">193</div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">203</div>
            </div>

            <div class="flex items-center gap-2">
                <div class="w-[20%] flex flex-col items-center justify-center gap-1">
                    <div class="w-8 h-8 rounded-full border border-slate-700 bg-slate-900 flex items-center justify-center overflow-hidden">
                        <img src="./icons/circle-flags/pe.svg" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[10px] font-bold text-white tracking-wide">PEN</span>
                </div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">285</div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">295</div>
            </div>

            <div class="flex items-center gap-2">
                <div class="w-[20%] flex flex-col items-center justify-center gap-1">
                    <div class="w-8 h-8 rounded-full border border-slate-700 bg-slate-900 flex items-center justify-center overflow-hidden">
                        <img src="./icons/circle-flags/co.svg" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[10px] font-bold text-white tracking-wide">COP</span>
                </div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">0,28</div>
                <div class="w-[40%] input-monto rounded-xl text-right text-lg font-mono font-bold text-white p-2.5">0,33</div>
            </div>

        </div>

        <!-- Botón Inferior de Cierre Visual -->
        <button type="button" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl text-sm flex justify-center items-center gap-2 shadow-lg shadow-blue-500/20 mt-6">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
            Actualizar Precios
        </button>

    </div>

    <!-- Marca de Agua Final -->
    <div class="mt-6 flex justify-center items-center gap-2 opacity-40">
        <img src="./assets/Logo Quadra Alt Titanium 2.svg" alt="Quadra Logo" class="h-4 w-4">
        <p class="text-[8px] text-slate-400 font-mono tracking-widest uppercase">© 2026 PIZARRAS QUADRA.</p>
    </div>
</body>
</html>
